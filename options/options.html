<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Broxy</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main class="page">
      <h1 data-i18n="optionsHeading">Broxy</h1>
      <p class="subtitle" data-i18n="optionsSubtitle"></p>

      <section class="card">
        <h2 data-i18n="proxySection"></h2>
        <div class="grid">
          <label>
            <span data-i18n="protocol"></span>
            <select id="scheme">
              <option value="http">HTTP</option>
              <option value="https">HTTPS</option>
              <option value="socks5">SOCKS5</option>
              <option value="socks4">SOCKS4</option>
            </select>
          </label>
          <label>
            <span data-i18n="host"></span>
            <input id="host" type="text" maxlength="253" data-i18n-placeholder="host" />
          </label>
          <label>
            <span data-i18n="port"></span>
            <input id="port" type="number" min="1" max="65535" placeholder="8080" />
          </label>
        </div>
        <label class="enabled-row">
          <input type="checkbox" id="enabled" />
          <span data-i18n="proxyEnabled"></span>
        </label>
      </section>

      <section class="card">
        <h2 data-i18n="sitesSection"></h2>
        <p class="hint" data-i18n="sitesHint"></p>
        <div class="add-row">
          <input id="newPattern" type="text" maxlength="253" placeholder="example.com" />
          <button class="btn" id="addPattern" type="button" data-i18n="add"></button>
        </div>
        <div class="presets">
          <span class="presets-label" data-i18n="presetsLabel"></span>
          <div class="presets-buttons" id="presets"></div>
        </div>
        <ul class="patterns" id="patterns"></ul>
      </section>

      <section class="card">
        <h2 data-i18n="howTitle"></h2>
        <p class="hint" data-i18n="howBody1"></p>
        <p class="hint" data-i18n="howBody2"></p>
        <p class="hint" data-i18n="howBody3"></p>
        <p class="hint" data-i18n="howBody4"></p>
      </section>

      <section class="card">
        <h2 data-i18n="privacyTitle"></h2>
        <p class="hint" data-i18n="privacyBody"></p>
      </section>

      <div class="save-bar">
        <span class="form-error" id="formError"></span>
        <span class="saved" id="savedMsg"></span>
        <button class="btn primary" id="save" type="button" data-i18n="save"></button>
      </div>
    </main>

    <script type="module" src="options.js"></script>
  </body>
</html>
