<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Broxy — Настройки</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main class="page">
      <h1>Broxy</h1>
      <p class="subtitle">
        Маршрутизирует только указанные сайты через локальный прокси. Остальной
        трафик идёт напрямую.
      </p>

      <section class="card">
        <h2>Локальный прокси</h2>
        <div class="grid">
          <label>
            Протокол
            <select id="scheme">
              <option value="http">HTTP</option>
              <option value="https">HTTPS</option>
              <option value="socks5">SOCKS5</option>
              <option value="socks4">SOCKS4</option>
            </select>
          </label>
          <label>
            Хост
            <input id="host" type="text" placeholder="127.0.0.1" />
          </label>
          <label>
            Порт
            <input id="port" type="number" min="1" max="65535" placeholder="8080" />
          </label>
        </div>
        <label class="enabled-row">
          <input type="checkbox" id="enabled" />
          Прокси включён
        </label>
      </section>

      <section class="card">
        <h2>Сайты для проксирования</h2>
        <p class="hint">
          Один домен на строку. Поддомены учитываются автоматически (например
          <code>example.com</code> покрывает и <code>www.example.com</code>).
        </p>
        <div class="add-row">
          <input id="newPattern" type="text" placeholder="example.com" />
          <button class="btn" id="addPattern">Добавить</button>
        </div>
        <div class="presets">
          <span class="presets-label">Пресеты:</span>
          <div class="presets-buttons" id="presets"></div>
        </div>
        <ul class="patterns" id="patterns"></ul>
      </section>

      <div class="save-bar">
        <span class="saved" id="savedMsg"></span>
        <button class="btn primary" id="save">Сохранить</button>
      </div>
    </main>

    <script type="module" src="options.js"></script>
  </body>
</html>
